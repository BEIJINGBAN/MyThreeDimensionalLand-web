<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>My3DLand</title>
    <style>body { margin: 0; overflow: hidden; }</style>
    <!-- 1. 直接 CDN 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</head>
<div style="position: absolute; top: 20px; left: 20px; z-index: 100;">
    <button onclick="changeColor()">改变颜色</button>
    <button onclick="moveCube()">移动位置</button>
    <button onclick="moveBackCube()">返回初始位置</button>
    <button onclick="loadCubeSettings()">后端请求</button>
</div>
<body>
<script>
    // 2. 初始化核心三大件：场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
   

    
    const seaGeometry = new THREE.PlaneGeometry(100,100);
    const seaMaterial = new THREE.MeshStandardMaterial({
        color: "#278eae"
    });
    const sea = new THREE.Mesh(seaGeometry,seaMaterial);
    sea.rotation.x = -Math.PI /2;
    sea.position.y = -0.3;
    

    const isLandGeometry = new THREE.CylinderGeometry(3,3.5,1,1000000);
    const isLandMaterial = new THREE.MeshStandardMaterial({
        color: "#8cab62"
    });
    const island = new THREE.Mesh(isLandGeometry,isLandMaterial);

    const rainGeometry = new THREE.SphereGeometry(0.3,8,8);
    const rainMaterial = new THREE.MeshStandardMaterial({
        color: "#b9ddff"
    });
    const rain = new THREE.Mesh(rainGeometry,rainMaterial);
    rain.position.x = 5;
    rain.position.y = 5;
    
    scene.add(island);
    scene.add(sea);
    scene.add(rain);
   
    camera.position.set(5,4,5);
    
    
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    // 1.环境光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    
    scene.add(ambientLight);
    scene.add(light);

    const clock = new THREE.clock();

    // 4. 渲染死循环
    function animate() {
        requestAnimationFrame(animate);
            
        rain.position.x-=0.1;
        rain.position.y-=0.1;
        controls.update();
        renderer.render(scene, camera);

        if(rain.position.y <= 0){
            rain.position.y = 18;
            rain.position.x = 8;
        }
    }
    animate();
    // 1. 改变材质属性（将颜色随机切换）
    function changeColor() {
        const randomColor = Math.floor(Math.random() * 0xffffff);
        island.material.color.setHex(randomColor);
    }

    function responseBackCube(settings) {
        cube.position.x = settings.position.x;
        cube.position.y = settings.position.y;
        cube.position.z = settings.position.z;
        cube.material.color.set(settings.color);
    }
    async function loadCubeSettings() {
        try{
            const response = await fetch("http://localhost:8080/cube/get");

            if(!response.ok){
                throw new Error("请求失败，http状态码："+response.status);
            }

            const settings = await response.json();
            console.log("后端返回的初始值",response);
            console.log("后端返回的设置",settings);
            responseBackCube(settings);
        }catch(error){
            console.log("加载设置失败：",error)
        }
    }
</script>
</body>
</html>
